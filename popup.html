<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 240px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #1a1a2e;
      color: #fff;
      margin: 0;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
      background: linear-gradient(135deg, #0077b5, #00d4aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .stat {
      background: #0d0d1a;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-value {
      font-size: 28px;
      font-weight: bold;
      color: #00d4aa;
    }
    .stat-label {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .hint {
      color: #666;
      font-size: 11px;
      text-align: center;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-linkedin {
      background: #0077b5;
      color: white;
    }
    .btn-linkedin:hover {
      background: #005885;
    }
    .btn-reset {
      background: rgba(231, 76, 60, 0.2);
      color: #e74c3c;
      border: 1px solid rgba(231, 76, 60, 0.3);
    }
    .btn-reset:hover {
      background: rgba(231, 76, 60, 0.3);
    }
  </style>
</head>
<body>
  <h1>TinkeDin</h1>

  <div class="stat-grid">
    <div class="stat">
      <div class="stat-value" id="liked-count">0</div>
      <div class="stat-label">Liked</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="hidden-count">0</div>
      <div class="stat-label">Hidden</div>
    </div>
  </div>

  <p class="hint">Use the control bar on linkedin.com to swipe posts and manage your feed.</p>

  <div class="actions">
    <button id="linkedin-btn" class="btn-linkedin">Open LinkedIn</button>
    <button id="reset-btn" class="btn-reset">Reset</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
